name: Build YouTube Frontend APK

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          fi
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fix gradle wrapper jar if missing
        run: |
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -L --retry 3 -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -lh gradle/wrapper/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build-log.txt
          echo "=== BUILD SUCCESS ==="
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee -a build-log.txt
          ls -lh app/build/outputs/apk/release/

      - name: Push logs to build-logs branch
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git fetch origin build-logs || echo "no build-logs branch"
          git checkout -B build-logs
          mkdir -p logs
          cp $GITHUB_WORKSPACE/build-log.txt logs/latest.txt || echo "no log" > logs/latest.txt
          echo "Run ${{ github.run_id }} - ${{ github.sha }} - $(date)" > logs/info.txt
          git add logs/
          git commit -m "Build log for run ${{ github.run_id }}" || true
          git push origin build-logs --force

      - name: List APKs
        if: always()
        run: |
          echo "=== APKs ==="
          find app/build -name "*.apk" -type f | xargs ls -lh || echo "No APKs found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-frontend-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-frontend-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          retention-days: 7
