name: Build YouTube Frontend APK

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK (preinstalled)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME || ls -la /usr/local/lib/android/sdk || echo "Checking sdk locations"
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_OUTPUT
          fi
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || echo "License accept done"

      - name: Install Android SDK packages
        run: |
          echo "Installing required SDK packages..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || echo "SDK install attempted"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fix gradle wrapper jar if missing
        run: |
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing or empty, downloading..."
            mkdir -p gradle/wrapper
            curl -L --retry 3 -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
            ls -lh gradle/wrapper/ || echo "wrapper dir missing"
          else
            echo "Wrapper jar exists: $(ls -lh gradle/wrapper/gradle-wrapper.jar)"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
          cache-read-only: false

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Build Debug APK with log capture
        run: |
          echo "=== Building Debug APK ==="
          set -o pipefail
          if [ -s gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build-log.txt || (echo "Build failed, saving log" && cat build-log.txt && exit 1)
          else
            gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build-log.txt || (echo "Build failed, saving log" && cat build-log.txt && exit 1)
          fi
        continue-on-error: true

      - name: Show build log tail
        if: always()
        run: |
          echo "=== BUILD LOG TAIL ==="
          tail -n 200 build-log.txt || echo "No log"
          echo "=== SEARCHING FOR ERRORS ==="
          grep -i "error\|failed\|exception" build-log.txt | tail -n 100 || echo "No errors found in grep"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          retention-days: 7

      - name: Build Release APK (only if debug succeeded)
        if: success()
        run: |
          echo "=== Building Release APK ==="
          if [ -s gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: List APKs
        if: always()
        run: |
          find app/build -name "*.apk" -type f 2>/dev/null | xargs ls -lh || echo "No APKs found"
          ls -R app/build/outputs/ 2>/dev/null || true

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-frontend-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-frontend-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

  build-info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show project structure
        run: |
          ls -R | head -100
