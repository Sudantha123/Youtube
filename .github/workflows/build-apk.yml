name: Build YouTube Frontend APK

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          fi
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fix gradle wrapper jar if missing
        run: |
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -L --retry 3 -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -lh gradle/wrapper/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build-log.txt || true
          echo "=== BUILD LOG TAIL ==="
          tail -n 300 build-log.txt
          echo "=== ERROR SUMMARY ==="
          grep -A 5 -B 5 -i "error\|FAILED\|Unresolved\|Could not" build-log.txt | tail -n 500 > error-summary.txt || true
          cat error-summary.txt
          # Check if APK was built
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK built successfully"
            exit 0
          else
            echo "APK not found, build failed"
            exit 1
          fi

      - name: Create issue with error log
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            let errorSummary = '';
            try {
              log = fs.readFileSync('build-log.txt', 'utf8');
              errorSummary = fs.readFileSync('error-summary.txt', 'utf8');
            } catch (e) {
              log = 'Could not read log: ' + e.message;
            }
            if (log.length > 50000) {
              log = log.slice(-50000);
            }
            const body = `## Build Failed - Run ${{ github.run_id }}

            **Branch:** ${{ github.ref }}
            **Commit:** ${{ github.sha }}

            ### Error Summary:
            \`\`\`
            ${errorSummary.slice(-10000)}
            \`\`\`

            ### Full Log Tail:
            \`\`\`
            ${log.slice(-20000)}
            \`\`\`
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build failed - Run ${{ github.run_id }} - ${{ github.sha.slice(0,7) }}`,
              body: body
            });

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-log.txt
            error-summary.txt
          retention-days: 7

      - name: Build Release APK
        if: success()
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: List APKs
        if: always()
        run: find app/build -name "*.apk" -type f 2>/dev/null | xargs ls -lh || echo "No APKs"

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-frontend-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
