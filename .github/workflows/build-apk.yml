name: Build YouTube Frontend APK

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          fi
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fix gradle wrapper jar if missing
        run: |
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -L --retry 3 -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -lh gradle/wrapper/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build-log.txt
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV
          # Also save error summary
          grep -A 10 -B 5 -i "error\|FAILED\|Unresolved\|Could not" build-log.txt | tail -n 300 > error-summary.txt || true
          cat error-summary.txt

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-log.txt
            error-summary.txt
          retention-days: 7

      - name: Create Gist with build log on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('build-log.txt', 'utf8');
            } catch (e) {
              log = 'Could not read log: ' + e.message;
            }
            if (log.length > 90000) {
              log = log.slice(-90000);
            }
            // Create gist
            const gist = await github.rest.gists.create({
              public: true,
              files: {
                'build-log.txt': {
                  content: log
                }
              },
              description: `Build failed log for run ${{ github.run_id }} - ${{ github.sha }}`
            });
            console.log(`Gist created: ${gist.data.html_url}`);
            // Also create issue with gist link
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build failed - Run ${{ github.run_id }} - Gist: ${gist.data.html_url}`,
              body: `Build failed. Gist with full log: ${gist.data.html_url}\n\nError summary:\n\`\`\`\n${log.split('\n').filter(l => /error|FAILED|Unresolved|Could not/i.test(l)).slice(-50).join('\n')}\n\`\`\``
            });

      - name: Build Release APK
        if: success()
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: List APKs
        if: always()
        run: find app/build -name "*.apk" -type f 2>/dev/null | xargs ls -lh || echo "No APKs"

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-frontend-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
