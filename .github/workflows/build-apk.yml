name: Build YouTube Frontend APK

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          fi
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fix gradle wrapper jar if missing
        run: |
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -L --retry 3 -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -lh gradle/wrapper/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build-log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV
          echo "=== BUILD LOG TAIL (500 lines) ==="
          tail -n 500 build-log.txt
          echo "=== ERROR SUMMARY ==="
          grep -A 10 -B 5 -i "error\|FAILED\|Unresolved\|Could not\|Exception" build-log.txt | tail -n 500 > error-summary.txt || true
          cat error-summary.txt
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK built successfully"
            exit 0
          else
            echo "APK not found, build failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Push logs to build-logs branch
        if: always()
        run: |
          echo "Pushing logs..."
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          # Fetch build-logs branch if exists
          git fetch origin build-logs || echo "build-logs branch not exists yet"
          git checkout -B build-logs
          mkdir -p logs
          cp $GITHUB_WORKSPACE/build-log.txt logs/latest.txt || echo "no log" > logs/latest.txt
          cp $GITHUB_WORKSPACE/error-summary.txt logs/error.txt || echo "no error" > logs/error.txt
          echo "Run ${{ github.run_id }} - ${{ github.sha }} - $(date)" > logs/info.txt
          git add logs/
          git commit -m "Build log for run ${{ github.run_id }} - ${{ github.sha }}" || echo "No changes to commit"
          git push origin build-logs --force

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-log.txt
            error-summary.txt
          retention-days: 7

      - name: Build Release APK
        if: success()
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: List APKs
        if: always()
        run: find app/build -name "*.apk" -type f 2>/dev/null | xargs ls -lh || echo "No APKs"

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-frontend-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
